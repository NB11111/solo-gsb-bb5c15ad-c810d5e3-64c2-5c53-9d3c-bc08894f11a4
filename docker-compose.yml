services:
  app:
    build: .
    container_name: clause-review
    ports:
      # 宿主机端口可用 APP_PORT 覆盖，例如：APP_PORT=8080 docker compose up
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_PATH: /data/review.db
    volumes:
      # SQLite 数据持久化到命名卷
      - review-data:/data
    restart: unless-stopped

volumes:
  review-data:
